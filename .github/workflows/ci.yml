name: ServerBench CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: serverbench-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-quality:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: serverbench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: serverbench-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d serverbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller

          KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: serverbench
      DB_USERNAME: postgres
      SERVERBENCH_DB_PASSWORD: serverbench-ci-password

      REDIS_HOST: localhost
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      GEMINI_API_KEY: ci-placeholder-key

      SPRING_DOCKER_COMPOSE_ENABLED: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Maven modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7


  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: server-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: server-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: server-frontend
        run: npm run build