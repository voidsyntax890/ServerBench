services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:17
    container_name: serverbench-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serverbench}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SERVERBENCH_DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-serverbench}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7
    container_name: serverbench-redis
    restart: unless-stopped

    command: [ "redis-server", "--appendonly", "yes" ]

    volumes:
      - redis-data:/data

    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: serverbench-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # Backend
  # ============================================================

  backend:
    build:
      context: .
      dockerfile: server-backend/Dockerfile

    image: serverbench-backend:local
    container_name: serverbench-backend
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-serverbench}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      SERVERBENCH_DB_PASSWORD: ${SERVERBENCH_DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      GEMINI_API_KEY: ${GEMINI_API_KEY}

    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # Agent
  # ============================================================

  agent:
    build:
      context: .
      dockerfile: server-agent/Dockerfile

    image: serverbench-agent:local
    container_name: serverbench-agent
    restart: unless-stopped

    environment:
      SERVERBENCH_AGENT_CONTROLLER_URL: http://backend:8080
      SERVERBENCH_AGENT_VERSION: ${SERVERBENCH_AGENT_VERSION:-1.0.0}
      SERVERBENCH_AGENT_MAX_CONCURRENCY: ${SERVERBENCH_AGENT_MAX_CONCURRENCY:-1000}
      SERVERBENCH_AGENT_HEARTBEAT_INTERVAL_MS: ${SERVERBENCH_AGENT_HEARTBEAT_INTERVAL_MS:-5000}

    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: .
      dockerfile: server-frontend/Dockerfile

    image: serverbench-frontend:local
    container_name: serverbench-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: serverbench-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

    depends_on:
      backend:
        condition: service_healthy

  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:latest
    container_name: serverbench-grafana
    restart: unless-stopped

    volumes:
      - grafana-data:/var/lib/grafana

    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

    depends_on:
      prometheus:
        condition: service_started

  # ============================================================
  # Jaeger
  # ============================================================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: serverbench-jaeger
    restart: unless-stopped

    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
